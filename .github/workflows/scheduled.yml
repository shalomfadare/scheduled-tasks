name: Daily Script

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

# Prevents multiple runs from stacking up; cancels any stuck background runs
concurrency:
  group: daily-script-group
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    
    # ⏱️ IF THE SCRIPT HANGS, CANCEL IT AUTOMATICALLY AFTER 10 MINUTES
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          # Force Python output to print in real time (helps debug where it hangs)
          PYTHONUNBUFFERED: "1"
        run: python main.py
